[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 500
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "../circuits" },
  { access = "read", path = "../packages/policy/test" },
  { access = "read-write", path = "../deployments" },
]

[fuzz]
runs = 512

[rpc_endpoints]
xlayer = "${XLAYER_RPC_URL}"
