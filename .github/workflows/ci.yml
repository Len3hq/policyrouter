name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Unit, fuzz and invariant tests (fork tests skip themselves)
        run: forge test
      - name: Coverage report (PolicyRegistry and CreditEscrow are at 100% lines)
        run: forge coverage --no-match-path "test/fork/*" --no-match-coverage "(test|script)/" --report summary
      - name: Fork tests against X Layer mainnet (read-only, nothing is broadcast)
        run: forge test --match-path "test/fork/*" --fork-url "${XLAYER_RPC_URL:-https://rpc.xlayer.tech}" -vv
        env:
          XLAYER_RPC_URL: ${{ secrets.XLAYER_RPC_URL }}
